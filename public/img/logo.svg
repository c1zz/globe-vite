<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for planet -->
    <radialGradient id="planetGradient">
      <stop offset="0%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </radialGradient>

    <!-- Gradient for orbits -->
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9933ff;stop-opacity:0.5" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for center planet -->
    <filter id="planetGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer orbit ring -->
  <ellipse cx="100" cy="100" rx="85" ry="85"
           fill="none"
           stroke="url(#orbitGradient)"
           stroke-width="2"
           opacity="0.6"
           filter="url(#glow)"/>

  <!-- Middle orbit ring -->
  <ellipse cx="100" cy="100" rx="60" ry="60"
           fill="none"
           stroke="url(#orbitGradient)"
           stroke-width="2.5"
           opacity="0.7"
           filter="url(#glow)"/>

  <!-- Inner orbit ring -->
  <ellipse cx="100" cy="100" rx="35" ry="35"
           fill="none"
           stroke="url(#orbitGradient)"
           stroke-width="1.5"
           opacity="0.5"/>

  <!-- Small orbiting planets -->
  <circle cx="100" cy="15" r="4" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="185" cy="100" r="3" fill="#9933ff" filter="url(#glow)" opacity="0.8"/>
  <circle cx="100" cy="185" r="3.5" fill="#00ffaa" filter="url(#glow)" opacity="0.85"/>
  <circle cx="40" cy="70" r="2.5" fill="#0099ff" opacity="0.7"/>

  <!-- Center planet/globe -->
  <circle cx="100" cy="100" r="20" fill="url(#planetGradient)" filter="url(#planetGlow)" opacity="0.95"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.4"/>

  <!-- Tech corner accents -->
  <g opacity="0.5">
    <path d="M 15 15 L 15 30 M 15 15 L 30 15"
          stroke="#00d4ff"
          stroke-width="2.5"
          stroke-linecap="square"/>
    <path d="M 185 15 L 185 30 M 185 15 L 170 15"
          stroke="#00d4ff"
          stroke-width="2.5"
          stroke-linecap="square"/>
    <path d="M 15 185 L 15 170 M 15 185 L 30 185"
          stroke="#00d4ff"
          stroke-width="2.5"
          stroke-linecap="square"/>
    <path d="M 185 185 L 185 170 M 185 185 L 170 185"
          stroke="#00d4ff"
          stroke-width="2.5"
          stroke-linecap="square"/>
  </g>

  <!-- Small dots at corners -->
  <circle cx="15" cy="15" r="2" fill="#00ffaa" opacity="0.6"/>
  <circle cx="185" cy="15" r="2" fill="#00ffaa" opacity="0.6"/>
  <circle cx="15" cy="185" r="2" fill="#00ffaa" opacity="0.6"/>
  <circle cx="185" cy="185" r="2" fill="#00ffaa" opacity="0.6"/>
</svg>
